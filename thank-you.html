<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex">
<title>Thank you — Abby Resnick Floral Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F5EFE2; --paper:#FBF7EE; --ink:#3A2A30; --ink-soft:#76675F;
  --mauve:#5A2A42; --lavender:#B9A7D0; --gold:#B0895A;
  --pad:clamp(22px,5vw,80px);
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Jost',-apple-system,Segoe UI,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:var(--sans);font-weight:300;
  min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:var(--pad)}
img{display:block;max-width:100%;height:auto}
a{color:inherit;text-decoration:none}
.logo{height:64px;width:auto;margin:0 auto 46px}
h1{font-family:var(--serif);font-weight:500;color:var(--mauve);
  font-size:clamp(2.2rem,5vw,3.4rem);line-height:1.1;margin-bottom:20px}
h1 em{font-style:italic;color:var(--lavender)}
p{color:var(--ink-soft);font-size:1.08rem;line-height:1.75;max-width:46ch;margin:0 auto 34px}
.btn{display:inline-block;font-family:var(--sans);font-weight:500;font-size:.74rem;
  letter-spacing:.2em;text-transform:uppercase;padding:16px 30px;
  border:1px solid var(--mauve);background:var(--mauve);color:var(--cream);transition:.35s ease}
.btn:hover{background:var(--ink);border-color:var(--ink)}
.rule{width:52px;height:1px;background:var(--gold);margin:0 auto 34px}
</style>
</head>
<body>
  <main>
    <img class="logo" src="assets/brand/logo.svg" alt="Abby Resnick — Floral Design, Los Angeles">
    <div class="rule"></div>
    <h1>Thank you &mdash; your note is <em>on its way.</em></h1>
    <p>We&rsquo;ve received your inquiry and will follow up personally. In the meantime, feel free to keep exploring the work.</p>
    <a href="index.html" class="btn">Back to the studio</a>
  </main>
</body>
</html>
